# Identificação e porta da aplicação
spring.application.name=chama-backend
server.port=${SERVER_PORT:8080}

# Datasource PostgreSQL (credenciais injetadas via variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chama}
spring.datasource.username=${DB_USERNAME:chama_app}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate estrito (schema gerenciado apenas via Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrações Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson 3: contrato snake_case e bloqueio contra Mass Assignment
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null

# Segurança, JWT e Rate Limit
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-issuer=${JWT_ISSUER:chama-backend}
app.security.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.security.refresh-token-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.security.auth-rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}

# Actuator e tratamento seguro de erros HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
