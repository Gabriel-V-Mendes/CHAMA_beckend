# Banco H2 em memória no modo PostgreSQL para testes automatizados isolados
spring.datasource.url=jdbc:h2:mem:chama_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Segurança em testes (custo BCrypt >= 12 conforme Spec 04)
app.security.jwt-secret=chama-test-secret-key-with-at-least-256-bits-for-hs256
app.security.bcrypt-strength=12
app.security.auth-rate-limit-per-minute=20
